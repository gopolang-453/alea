# Fly.io configuration for the ALEA web app + API. NOT DEPLOYED.
# Deploying needs the owner's Fly.io account and payment card (see docs/HOSTING_OPTIONS.md).
#   fly apps create <your-app-name>
#   fly deploy --app <your-app-name> --ha=false   # --ha=false: one machine, not the default two
# No secrets are needed: the ledger is downloaded from the public prospective-ledger branch,
# verified with the append-only commit gate and refreshed every 30 minutes.
app = "alea-forecasts"            # change to a globally unique name
primary_region = "jnb"            # Johannesburg; any region works

[build]
  dockerfile = "Dockerfile"

[env]
  ALEA_LEDGER_SYNC_URL = "https://raw.githubusercontent.com/gopolang-453/alea/prospective-ledger"
  ALEA_LEDGER_SYNC_MINUTES = "30"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"      # keep the sync timer running
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40               # simple overload protection in Fly's proxy

[[http_service.checks]]
  grace_period = "30s"
  interval = "60s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

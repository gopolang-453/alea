name: ALEA tests

on:
  push:
    branches: [main]
    paths:
      - "alea_predictor_v2_4_1.py"
      - "dev/**"
      - "stages/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/stage1-regression.yml"
  pull_request:
    paths:
      - "alea_predictor_v2_4_1.py"
      - "dev/**"
      - "stages/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/stage1-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run repository tests
        run: python -m pytest -q tests dev/tests stages/stage9/tests

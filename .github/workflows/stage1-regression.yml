name: Stage 1 regression checks

on:
  push:
    branches: [main]
    paths:
      - "stages/stage1/**"
      - "tests/test_stage1_data_store.py"
      - "stages/stage9/tests/test_stage9_1_real_data.py"
      - "tests/fixtures/epl_sample.csv"
      - "stages/stage9/tests/test_stage9_1_real_data.py"
      - "tests/fixtures/epl_sample.csv"
      - ".github/workflows/stage1-regression.yml"
  pull_request:
    paths:
      - "stages/stage1/**"
      - "tests/test_stage1_data_store.py"
      - ".github/workflows/stage1-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy
      - name: Run Stage 1 and Stage 9.1 regression tests
        run: python -m pytest -q tests/test_stage1_data_store.py stages/stage9/tests/test_stage9_1_real_data.py

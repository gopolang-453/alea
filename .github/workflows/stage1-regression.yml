name: ALEA tests

on:
  push:
    branches: [main, "repair/**"]
    paths:
      - "alea_predictor_v2_4_1.py"
      - "dev/**"
      - "stages/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pytest.ini"
      - "scripts/**"
      - ".github/workflows/stage1-regression.yml"
  pull_request:
    paths:
      - "alea_predictor_v2_4_1.py"
      - "dev/**"
      - "stages/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/stage1-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alea-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run repository tests
        run: python -m pytest -q
      - name: Scan working tree for high-confidence secrets
        run: python scripts/security_check.py
